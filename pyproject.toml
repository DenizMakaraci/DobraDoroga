[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roadwatch"
version = "0.2.0"
description = "Evidence-led road construction investigations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "openai>=1.40,<3",
  "pypdf>=5,<7",
  "python-dotenv>=1,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
mongo = ["pymongo>=4.9,<5"]

[tool.setuptools]
packages = ["roadwatch"]

[tool.setuptools.package-data]
roadwatch = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
