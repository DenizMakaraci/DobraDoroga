# Roadwatch on Render: one free web service, with cases, accounts and discussion in MongoDB Atlas.
# The free plan has no disk and sleeps when idle, so nothing may live on the server: ROADWATCH_MONGODB_URI is
# required, and the open-data cache in /tmp is simply downloaded again after a restart.
# Values marked sync: false are asked for when the Blueprint is created and never live in git.
# In Atlas, Network Access must allow 0.0.0.0/0, because Render's free plan has no fixed outbound address.
services:
  - type: web
    name: roadwatch
    runtime: python
    plan: free
    buildCommand: pip install '.[mongo]'
    startCommand: uvicorn roadwatch.server:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ROADWATCH_MONGODB_URI
        sync: false          # the Atlas connection string (mongodb+srv://...)
      - key: ROADWATCH_ACCESS_KEY
        sync: false          # the administrator's sign-in key; choose a long one
      - key: ROADWATCH_API_KEY
        sync: false          # model provider key
      - key: ROADWATCH_CACHE
        value: /tmp/roadwatch-cache
      - key: ROADWATCH_SIGNUP
        value: invite        # or open
      - key: ROADWATCH_GUEST
        value: "on"          # anyone with the address can read every case without an account; "off" to require sign-in
      - key: ROADWATCH_MODEL
        value: gemini-3.6-flash
      - key: ROADWATCH_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: ROADWATCH_EMBED_MODEL
        value: gemini-embedding-001   # search by meaning; remove to turn it off
      - key: ROADWATCH_DAILY_AI_LIMIT
        value: "40"
