# Roadwatch on Render: one web service with a persistent disk for the SQLite case database.
# The Starter plan is required for the disk; the Free plan has no persistent storage and
# would lose every case on restart. After the first deploy, set ROADWATCH_API_KEY and
# ROADWATCH_ACCESS_KEY in the dashboard (they are marked sync: false so they never live in git).
services:
  - type: web
    name: roadwatch
    runtime: python
    plan: starter
    numInstances: 1          # SQLite needs a single instance
    buildCommand: pip install .
    startCommand: uvicorn roadwatch.server:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ROADWATCH_DB
        value: /var/data/roadwatch.sqlite3
      - key: ROADWATCH_ACCESS_KEY
        sync: false          # the shared sign-in key for your users; paste in dashboard
      - key: ROADWATCH_API_KEY
        sync: false          # model provider key; paste in dashboard
      - key: ROADWATCH_SIGNUP
        value: invite        # or open
      - key: ROADWATCH_PUBLIC_URL
        sync: false          # e.g. https://roadwatch.onrender.com, used in invite links
      - key: ROADWATCH_SMTP_HOST
        sync: false          # optional: email for invites and password resets
      - key: ROADWATCH_SMTP_USER
        sync: false
      - key: ROADWATCH_SMTP_PASSWORD
        sync: false
      - key: ROADWATCH_MAIL_FROM
        sync: false
      - key: ROADWATCH_MODEL
        value: gemini-3.8-flash
      - key: ROADWATCH_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: ROADWATCH_DAILY_AI_LIMIT
        value: "40"
    disk:
      name: roadwatch-data
      mountPath: /var/data
      sizeGB: 1
